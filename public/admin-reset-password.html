<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ilgaz Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#d63031', 'primary-hover': '#b02626' }
                }
            }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Reset Password</h1>
            <p class="text-gray-500 mt-2">Create a new secure password for your account.</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <input type="hidden" id="token">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">New Password</label>
                <input type="password" id="newPassword" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-primary focus:border-primary outline-none transition-colors" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">Confirm New Password</label>
                <input type="password" id="confirmPassword" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-primary focus:border-primary outline-none transition-colors" placeholder="••••••••">
            </div>

            <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-semibold text-center"></div>

            <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 rounded-lg shadow-md shadow-red-500/20 transition-all">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('token').value = urlParams.get('token');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alertBox');
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert.innerText = "Passwords do not match.";
                alert.className = "p-3 rounded-lg text-sm font-semibold text-center bg-red-100 text-red-700";
                alert.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Resetting...';

            try {
                const response = await fetch('/api/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert.innerText = "Password reset successful! Redirecting to login...";
                    alert.className = "p-3 rounded-lg text-sm font-semibold text-center bg-green-100 text-green-700";
                    alert.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'admin-login.html', 2000);
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                alert.innerText = err.message;
                alert.className = "p-3 rounded-lg text-sm font-semibold text-center bg-red-100 text-red-700";
                alert.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Reset Password';
            }
        });
    </script>
</body>
</html>
