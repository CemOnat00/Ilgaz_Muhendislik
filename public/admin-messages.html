<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages - Ilgaz Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: { 
                        primary: '#d63031', 
                        'primary-hover': '#b02626',
                        'primary-light': '#fee2e2',
                        'dark-navy': '#151b2b', 
                        'text-dark': '#1f2937' 
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #1f2937; }
        .border { border-width: 1px; }
        .border-b { border-bottom-width: 1px; }
        .border-t { border-bottom-width: 1px; }
        .border-r { border-right-width: 1px; }
        .border-l { border-left-width: 1px; }
        
        /* Custom scrollbar for message list */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 10px; }
    </style>
</head>

<body class="flex h-screen overflow-hidden selection:bg-primary selection:text-white">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-white border-r border-gray-200 flex flex-col justify-between flex-shrink-0 relative z-20">
        <div>
            <!-- Logo -->
            <div class="h-20 px-6 flex items-center border-b border-gray-100">
                <a href="admin-dashboard.html" class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-sm">
                        <i class="fa-solid fa-industry text-sm"></i>
                    </div>
                    <div class="flex flex-col leading-none justify-center">
                        <span class="font-bold text-[15px] text-gray-900">Ilgaz Mühendislik</span>
                        <span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wide mt-0.5">Admin Panel</span>
                    </div>
                </a>
            </div>

            <!-- Menu -->
            <nav class="p-4 flex flex-col gap-1.5 mt-2">
                <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium rounded-lg transition-colors">
                    <i class="fa-solid fa-border-all w-5 text-center text-lg"></i>
                    <span class="text-sm">Dashboard</span>
                </a>
                
                <a href="admin-products.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium rounded-lg transition-colors">
                    <i class="fa-solid fa-box w-5 text-center text-lg"></i>
                    <span class="text-sm">Products & Services</span>
                </a>
                
                <!-- Active Item -->
                <a href="admin-messages.html" class="flex items-center justify-between px-4 py-3 bg-primary-light text-primary font-semibold rounded-lg transition-colors group">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-envelope w-5 text-center text-lg"></i>
                        <span class="text-sm">Messages</span>
                    </div>
                    <span id="sidebar-msg-count" class="bg-primary text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
                </a>
                
                <a href="admin-projects.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium rounded-lg transition-colors">
                    <i class="fa-solid fa-compass-drafting w-5 text-center text-lg"></i>
                    <span class="text-sm">Engineering Projects</span>
                </a>
            </nav>
        </div>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-gray-100 flex flex-col gap-2">
            <a href="admin-settings.html" class="flex items-center gap-3 px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium rounded-lg transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                <span class="text-sm">Settings</span>
            </a>
            <a href="admin-login.html" class="flex items-center gap-3 px-4 py-2.5 text-gray-500 hover:bg-red-50 hover:text-primary font-medium rounded-lg transition-colors mt-2">
                <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center"></i>
                <span class="text-sm">Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-grow flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <header class="h-20 bg-white border-b border-gray-200 px-8 flex items-center justify-between flex-shrink-0">
            <!-- Search Bar -->
            <div class="relative w-[400px]">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                </div>
                <input type="text" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full pl-10 p-2.5 outline-none transition-colors" placeholder="Search messages, names, or emails...">
            </div>
            
            <div class="flex items-center gap-6">
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="flex-grow overflow-hidden flex flex-col p-8 pb-0">
            <div class="max-w-[1400px] w-full mx-auto flex flex-col h-full">
                
                <!-- Page Header -->
                <div class="flex justify-between items-center mb-4 flex-shrink-0">
                    <div>
                        <h2 class="text-xl font-black text-gray-900 tracking-tight">Contact Messages</h2>
                    </div>
                    <div class="flex gap-3">
                        <button id="exportCSV" class="bg-primary hover:bg-primary-hover text-white font-bold py-2 px-4 rounded-lg shadow-md shadow-red-500/20 transition-all flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-download"></i> Export CSV
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-8 border-b border-gray-200 mb-4 px-2 flex-shrink-0" id="messageTabs">
                    <button class="pb-4 font-bold text-primary border-b-2 border-primary" data-tab="all">
                        All Messages <span id="count-all" class="bg-red-50 text-primary text-[10px] px-2 py-0.5 rounded-full">0</span>
                    </button>
                    <button class="pb-4 font-semibold text-gray-500 hover:text-gray-700 transition-colors border-b-2 border-transparent" data-tab="unread">
                        Unread
                    </button>
                </div>

                <!-- Messages Layout -->
                <div class="flex gap-6 h-full min-h-0 pb-8">
                    
                    <!-- Left Column: Message List -->
                    <div id="messageListContainer" class="w-full bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col">
                        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center text-xs font-bold text-gray-400 uppercase tracking-widest bg-gray-50/50">
                            <span>Recent Inquiries</span>
                            <button class="hover:text-gray-600"><i class="fa-solid fa-arrow-down-short-wide"></i></button>
                        </div>
                        
                        <div id="messageList" class="flex-grow overflow-y-auto custom-scrollbar">
                            <!-- Messages will be populated by JS -->
                        </div>

                        <!-- Pagination -->
                        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-between items-center">
                            <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wide">1-4 of 24</span>
                            <div class="flex gap-1.5">
                                <button class="w-8 h-8 flex items-center justify-center border border-gray-200 bg-white rounded-md text-gray-400 hover:bg-gray-50 transition-colors shadow-sm"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                                <button class="w-8 h-8 flex items-center justify-center border border-gray-200 bg-white rounded-md text-gray-600 hover:bg-gray-50 transition-colors shadow-sm"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Message Detail -->
                    <div id="messageDetailContainer" class="w-full hidden flex-col h-full">
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[110] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-red-50 text-primary rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <h3 class="text-xl font-black text-gray-900 mb-2">Delete Message?</h3>
                <p class="text-gray-500 text-sm mb-8">This inquiry will be permanently removed. This action cannot be undone.</p>
                <div class="flex flex-col gap-3">
                    <button id="confirmDeleteBtn" class="w-full py-3 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl transition-all shadow-md shadow-red-500/20">Confirm Delete</button>
                    <button onclick="closeDeleteModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-xl transition-all">Cancel</button>
                </div>
            </div>
        </div>
    </div>

</body>
<script>
    let allMessages = [];
    let currentFilter = 'all';
    let deleteTargetId = null;
    const deleteModal = document.getElementById('deleteModal');

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'admin-login.html';
            return;
        }

        await loadMessages();
        setupTabs();
        setupExport();
    });

    async function loadMessages() {
        const token = localStorage.getItem('adminToken');
        try {
            const response = await fetch('/api/admin/mesajlar', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.status === 401) {
                window.location.href = 'admin-login.html';
                return;
            }

            allMessages = await response.json();
            document.getElementById('count-all').innerText = allMessages.length;
            
            // Update sidebar unread count
            const unreadCount = allMessages.filter(m => !m.okundu_mu).length;
            const sidebarBadge = document.getElementById('sidebar-msg-count');
            if (sidebarBadge) sidebarBadge.innerText = unreadCount;

            renderMessages();
        } catch (error) {
            console.error('Mesajlar yüklenemedi:', error);
        }
    }

    function setupTabs() {
        document.querySelectorAll('#messageTabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#messageTabs button').forEach(b => {
                    b.classList.remove('text-primary', 'border-primary', 'font-bold');
                    b.classList.add('text-gray-500', 'border-transparent', 'font-semibold');
                });
                btn.classList.add('text-primary', 'border-primary', 'font-bold');
                btn.classList.remove('text-gray-500', 'border-transparent', 'font-semibold');
                currentFilter = btn.dataset.tab;
                renderMessages();
            });
        });
    }

    function renderMessages() {
        const messageList = document.getElementById('messageList');
        const filtered = allMessages.filter(m => {
            if (currentFilter === 'unread') return !m.okundu_mu;
            return true;
        });

        messageList.innerHTML = filtered.map(m => {
            const mId = m.id || m._id;
            const initials = (m.ad_soyad || 'Anonymous').split(' ').filter(n => n).map(n => n[0]).join('').substring(0, 2).toUpperCase();
            const date = new Date(m.created_at || m.tarih).toLocaleString('tr-TR', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            return `
            <div class="flex items-start gap-4 px-6 py-5 border-l-4 ${m.okundu_mu ? 'border-transparent' : 'border-primary'} hover:bg-gray-50 cursor-pointer border-b border-gray-50 transition-colors" onclick="showDetail('${mId}')">
                <div class="w-10 h-10 rounded-full bg-red-50 text-primary flex items-center justify-center font-bold text-sm flex-shrink-0 mt-0.5">
                    ${initials}
                </div>
                <div class="flex-grow min-w-0">
                    <div class="flex justify-between items-baseline mb-0.5">
                        <p class="text-gray-700 font-bold truncate">${m.ad_soyad || 'Anonymous'}</p>
                        <p class="text-gray-400 text-[11px] font-medium whitespace-nowrap ml-2">${date}</p>
                    </div>
                    <p class="text-gray-600 text-sm font-semibold truncate mb-1">${m.konu || 'No Subject'}</p>
                    <p class="text-xs text-gray-400 truncate">${m.mesaj || ''}</p>
                </div>
            </div>`;
        }).join('');

        // Update pagination text
        const paginationText = document.querySelector('.px-6.py-4.border-t span');
        if (paginationText) {
            paginationText.innerText = filtered.length > 0 ? `1-${filtered.length} of ${filtered.length}` : '0-0 of 0';
        }
    }

    async function showDetail(id) {
        const m = allMessages.find(msg => (msg.id || msg._id) === id);
        if (!m) return;
        const msgId = m.id || m._id;

        if (!m.okundu_mu) {
            const token = localStorage.getItem('adminToken');
            try {
                await fetch(`/api/admin/mesajlar/${msgId}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                m.okundu_mu = true;
                
                // Update sidebar unread count without full reload
                const unreadCount = allMessages.filter(msg => !msg.okundu_mu).length;
                const sidebarBadge = document.getElementById('sidebar-msg-count');
                if (sidebarBadge) sidebarBadge.innerText = unreadCount;
                
                // Update list styling without full re-render if possible
                renderMessages();
            } catch (e) {
                console.error("Okundu olarak isaretlenemedi", e);
            }
        }

        document.getElementById('messageListContainer').classList.add('hidden');
        const detailContainer = document.getElementById('messageDetailContainer');
        detailContainer.classList.remove('hidden');
        detailContainer.classList.add('flex');
        const displayDate = new Date(m.created_at || m.tarih).toLocaleString('tr-TR');
        detailContainer.innerHTML = `
            <div class="bg-white rounded-xl border border-gray-100 shadow-sm flex flex-col h-full overflow-hidden">
                <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/30">
                    <div class="flex items-center gap-4 text-gray-400 text-lg">
                        <button onclick="hideDetail()" class="hover:text-gray-700" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
                        <button onclick="confirmDelete('${msgId}')" class="hover:text-primary transition-colors" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest"><i class="fa-regular fa-clock mr-1"></i> Received ${displayDate}</span>
                </div>
                <div class="p-8 flex-grow overflow-y-auto custom-scrollbar">
                    <h3 class="text-2xl font-black text-gray-900 mb-4">${m.konu || 'No Subject'}</h3>
                    <div class="flex items-center gap-2 mb-8">
                        <span class="text-sm text-gray-500">From:</span>
                        <span class="text-sm font-bold text-primary">${m.ad_soyad || 'Anonymous'}</span>
                        <span class="text-sm text-gray-500">(${m.email || 'No Email'})</span>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-8 border border-gray-100 italic text-[15px] text-gray-700 leading-relaxed">
                        "${m.mesaj || ''}"
                    </div>
                </div>
                <div class="p-6 border-t border-gray-100 bg-gray-50">
                    <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                        <textarea id="replyTextarea" class="w-full text-sm text-gray-700 resize-none outline-none bg-transparent" rows="3" placeholder="Click here to reply..."></textarea>
                        <div class="flex justify-end mt-3 pt-3 border-t border-gray-100">
                            <button onclick="sendReply('${m.id}')" id="sendReplyBtn" class="bg-primary hover:bg-primary-hover text-white text-sm font-bold py-2 px-6 rounded-md transition-colors shadow-sm">Send Reply</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    async function sendReply(id) {
        const replyText = document.getElementById('replyTextarea').value;
        if (!replyText.trim()) return alert("Lütfen bir yanıt yazın");

        const btn = document.getElementById('sendReplyBtn');
        btn.disabled = true;
        btn.innerText = "Gönderiliyor...";

        const token = localStorage.getItem('adminToken');
        try {
            const response = await fetch(`/api/admin/mesajlar/${id}/reply`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ message: replyText })
            });

            if (response.ok) {
                alert("Yanıtınız başarıyla gönderildi!");
                window.location.reload();
            } else {
                const err = await response.json();
                alert("Hata: " + (err.error || "Gönderilemedi"));
            }
        } catch (error) {
            console.error("Reply error:", error);
            alert("Sistem hatası");
        } finally {
            btn.disabled = false;
            btn.innerText = "Send Reply";
        }
    }

    function hideDetail() {
        document.getElementById('messageDetailContainer').classList.add('hidden');
        document.getElementById('messageDetailContainer').classList.remove('flex');
        document.getElementById('messageListContainer').classList.remove('hidden');
    }

    function confirmDelete(id) {
        deleteTargetId = id;
        deleteModal.classList.remove('hidden');
        deleteModal.classList.add('flex');
    }

    function closeDeleteModal() {
        deleteModal.classList.add('hidden');
        deleteModal.classList.remove('flex');
        deleteTargetId = null;
    }

    document.getElementById('confirmDeleteBtn').onclick = async () => {
        if (!deleteTargetId) return;
        const token = localStorage.getItem('adminToken');
        try {
            const res = await fetch(`/api/admin/mesajlar/${deleteTargetId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                closeDeleteModal();
                allMessages = allMessages.filter(msg => (msg.id || msg._id) !== deleteTargetId);
                renderMessages();
                hideDetail();
            }
        } catch (e) {}
    };

    function setupExport() {
        document.getElementById('exportCSV').addEventListener('click', () => {
            const escape = (str) => `"\${(str || '').toString().replace(/"/g, '""')}"`;
            let csvContent = "data:text/csv;charset=utf-8,ID,Name,Email,Subject,Date,Message\n";
            allMessages.forEach(m => {
                csvContent += `\${escape(m.id)},\${escape(m.ad_soyad)},\${escape(m.email)},\${escape(m.konu)},\${escape(m.created_at || m.tarih)},\${escape(m.mesaj)}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "messages.csv");
            document.body.appendChild(link);
            link.click();
        });
    }
</script>
</html>
