<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Ilgaz Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#d63031', 'primary-hover': '#b02626' }
                }
            }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Forgot Password?</h1>
            <p class="text-gray-500 mt-2">Enter your email and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgotForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" required class="block w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-primary focus:border-primary outline-none transition-colors" placeholder="admin@ilgazmuhendislik.com">
                </div>
            </div>

            <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-semibold text-center"></div>

            <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 rounded-lg shadow-md shadow-red-500/20 transition-all flex items-center justify-center gap-2">
                Send Reset Link
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="admin-login.html" class="text-sm font-semibold text-gray-500 hover:text-primary transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alertBox');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.innerText = 'Processing...';

            try {
                const response = await fetch('/api/admin/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert.innerText = "If an account exists with this email, you will receive a reset link shortly.";
                    alert.className = "p-3 rounded-lg text-sm font-semibold text-center bg-green-100 text-green-700";
                    alert.classList.remove('hidden');
                    // In a real app, the link would be in the email. 
                    // For this project, I'll provide a direct link button for convenience if it's the admin email.
                    if (result.reset_url) {
                         setTimeout(() => {
                             alert.innerHTML += `<br><br><a href="${result.reset_url}" class="underline font-bold">Go to Reset Page (Dev Mode Only)</a>`;
                         }, 1000);
                    }
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                alert.innerText = err.message;
                alert.className = "p-3 rounded-lg text-sm font-semibold text-center bg-red-100 text-red-700";
                alert.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
